<!DOCTYPE html>

<html lang="en">

<head>
   <title>Jigsaw Puzzle</title>
   <meta charset="UTF-8">
   <meta name="description" content="Online Jigsaw Puzzle Game">
   <meta name="author" content="Kaunli Hehr">
   <link rel="icon" href="../KH_LOGO.png">
   
   <link href="puzzle.css" rel="stylesheet">
   <script src="puzzle.js" defer></script>
</head> 

<body onload="startTimer()">
   <h2>Jigsaw Puzzle</h2>
   <img id="grid" src="puzzleback.gif" alt="Jigsaw puzzle boar">
   
   <div id="piecesContainer">
      <!--Will display the puzzel pieces-->
   </div>
   
   <div id="timer">
      <input type="text" id="timer" value="Time: 00:00:00">
   </div>

   <button id="stop"onclick="stopTimer()">Done</button>
   <div id="endTime"></div>
   <div id="result"></div>


</body>
</html>
